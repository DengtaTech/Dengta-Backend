name: Bump version on main head

# 一次只能有一個 workflow 執行
concurrency: bump_version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Which type of bump for the version'
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch

env:
    DEPLOY_ACCOUNT: githubactions
    SERVER_HOST: backend.dengta.org
          

jobs:
  bump-version:
    runs-on: [self-hosted, dengta-ubuntu]
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GHPAT_WEITING }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          token: ${{ secrets.GHPAT_WEITING }}

      - name: Move code to /srv 
        run: |
            echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S rm -rf /srv/dengta-dump-version
            echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S mkdir -p /srv/dengta-dump-version
            echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S cp -r {,.[!.],..?}* /srv/dengta-dump-version
            echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S chown -R $USER:$USER /srv/dengta-dump-version
    
      - name: Bump version
        run: |
            cd /srv/dengta-dump-version
            ls -la
            INPUT_BUMP_TYPE="${{ github.event.inputs.bump_type }}"
            echo "Bump version, input: $INPUT_BUMP_TYPE"
            if [ "$INPUT_BUMP_TYPE" == "major" ]; then
                new_version=$(echo $(grep -E -o "[0-9](.*)" .version) | awk -F. '{print $1+1".0.0"}')
            elif [ "$INPUT_BUMP_TYPE" == "minor" ]; then
                new_version=$(echo $(grep -E -o "[0-9](.*)" .version) | awk -F. '{print $1"."$2+1".0"}')
            elif [ "$INPUT_BUMP_TYPE" == "patch" ]; then
                new_version=$(echo $(grep -E -o "[0-9](.*)" .version) | awk -F. '{print $1"."$2"."$3+1}')
            else
                echo "Invalid option"
                exit 1
            fi
            echo "New version: $new_version"

