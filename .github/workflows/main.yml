name: Dengta Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - "develop"

env:
  DEPLOY_ACCOUNT: githubactions
  SERVER_HOST: backend.dengta.org

jobs:
  deploy:
    runs-on: [self-hosted, dengta-ubuntu]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move code to /srv
        run: |
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S rm -rf /srv/dengta-backend-development
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S mkdir -p /srv/dengta-backend-development
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S cp -r ./* /srv/dengta-backend-development

      - name: scp .env.production to server
        run: |
          echo "${{ secrets.COMPOSE_ENV_FILE_DEV }}" > .env.development
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S cp .env.development /srv/dengta-backend-development/.env.development
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S chown -R $USER:$USER /srv/dengta-backend-development

      - name: Update Docker Containers and Images
        run: |
          docker compose -f /srv/dengta-backend-development/docker-compose.yml down
          docker compose -f /srv/dengta-backend-development/docker-compose.yml --env-file /srv/dengta-backend-development/.env.development up --build -d

      - name: Send Notification to Discord
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            [Deploy] Deployment completed on backend.dengta.org. The [${{ github.event_name }}] event triggered by 「${{ github.actor }}」 on ${{ github.ref }} (commit ${{ github.sha }}) succeeded.
