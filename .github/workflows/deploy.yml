name: Dengta Backend CD

concurrency: production

on:
  push:
    tags:
      - 'v*'
  # Trigger when push a tag with format v* (e.g. v1.0.0)

env:
  DEPLOY_ACCOUNT: githubactions
  SERVER_HOST: backend.dengta.org

# For action-gh-release
permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  deploy:
    needs: test
    runs-on: [self-hosted, dengta-ubuntu]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move code to /srv
        run: |
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S rm -rf /srv/dengta-backend-production
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S mkdir -p /srv/dengta-backend-production
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S cp -r ./* /srv/dengta-backend-production

      - name: scp .env.production to server
        run: |
          echo "${{ secrets.COMPOSE_ENV_FILE_PRODUCTION }}" > .env.production
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S cp .env.production /srv/dengta-backend-production/.env.production
          echo "${{ secrets.GITHUBACTIONS_USER_PASSWD }}" | sudo -S chown -R $USER:$USER /srv/dengta-backend-production

      - name: Update Docker Containers and Images
        run: |
          docker compose -f /srv/dengta-backend-production/docker-compose.yml down
          docker compose -f /srv/dengta-backend-production/docker-compose.yml --env-file /srv/dengta-backend-production/.env.production build --no-cache
          docker compose -f /srv/dengta-backend-production/docker-compose.yml --env-file /srv/dengta-backend-production/.env.production up -d
          docker exec nginx nginx -s reload
      - name: Discord success notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USERNAME: DengTa Chill Bot
          DISCORD_AVATAR: https://truth.bahamut.com.tw/s01/202309/379d1c40ad39d1ab3be487687c8caa8c.JPG
        uses: Ilshidur/action-discord@master
        with:
          args: '✅ **[Deploy]** Deployment completed on backend.dengta.org. 「${{ github.actor }}」幹得好🥳'
      - name: Notify on fail
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USERNAME: DengTa Chill Bot
          DISCORD_AVATAR: https://truth.bahamut.com.tw/s01/202309/379d1c40ad39d1ab3be487687c8caa8c.JPG
        uses: Ilshidur/action-discord@master
        with:
          args: '🚫 **[Deploy]** Deployment failed. 「${{ github.actor }}」在衝殺小👺'
  create-release:
    needs: [deploy]
    runs-on: [self-hosted, dengta-ubuntu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create a Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
