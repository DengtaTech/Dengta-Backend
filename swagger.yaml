openapi: '3.0.0'
info:
  version: '1.0.0'
  title: 'DengTA API'
  description: DengTA

servers:
  - url: 'http://localhost:3001/api/1.0'

paths:
  /user/signup:
    post:
      tags:
        - User
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - lifeRole
                - gender
                - birthday
                - email
                - password
                - links
              properties:
                name:
                  type: string
                lifeRole:
                  type: string
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - nonbinary
                    - notdisclosed
                birthday:
                  type: string
                email:
                  type: string
                password:
                  type: string
                links:
                  type: array
              example:
                name: John Doe
                lifeRole: Student
                gender: male
                birthday: '1990-01-01'
                email: johndoe@example.com
                password: mypassword123
                links: []
      responses:
        '200':
          description: Sign up successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
        403:
          $ref: '#/components/errors/EmailExistsError'
  /user/info:
    get:
      tags:
        - User
      summary: Get user personal information
      responses:
        '200':
          description: Sign up successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
      security:
        - bearerAuth: []
  /user/avatar:
    post:
      tags:
        - User
      summary: Upload user avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload avatar successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Upload avatar successfully'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Unauthorized'
        '400':
          description: Invalid file type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'File must be an image'
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginUserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjE1IiwiaWF0IjoxNzIxNDY2ODk3LCJleHAiOjE3MjE1NTMyOTd9.RtvpdPUgSh00UyvtHhQbB8wib-tjguHWsVk-RAExOJY'
            accessExpired:
              type: string
              example: '86400'
            user:
              type: object
              properties:
                id:
                  type: string
                  example: '15'
                provider:
                  type: string
                  example: 'native'
                realName:
                  type: string
                  example: 'John Doe'
                accountName:
                  type: string
                  example: 'johndoe'
                email:
                  type: string
                  example: 'johndoe@example.com'
                avatar:
                  type: string
                  nullable: true
    UserInfoResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              example: '15'
            provider:
              type: string
              example: 'native'
            realName:
              type: string
              example: 'John Doe'
            accountName:
              type: string
              example: 'johndoe'
            email:
              type: string
              example: 'johndoe@example.com'
            avatar:
              type: string
              nullable: true
  errors:
    EmailExistsError:
      description: Email already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Email already exists.'
