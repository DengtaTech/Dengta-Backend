version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ${ETCD_CONTAINER_NAME}
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - dengta_milvus_etcd_volume:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 10s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ${MILVUS_MINIO_CONTAINER_NAME}
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY}
    ports:
      - '${MILVUS_MINIO_CONSOLE_PORT}:9001'
      - '${MILVUS_MINIO_API_PORT}:9000'
    volumes:
      - dengta_milvus_minio_volume:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 20s
      retries: 3

  standalone:
    container_name: ${MILVUS_CONTAINER_NAME}
    image: milvusdb/milvus:v2.4.6
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: ${ETCD_CONTAINER_NAME}:2379
      MINIO_ADDRESS: ${MILVUS_MINIO_CONTAINER_NAME}:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY}
      MILVUS_ROOT_USERNAME: ${MILVUS_ROOT_USERNAME}
      MILVUS_ROOT_PASSWORD: ${MILVUS_ROOT_PASSWORD}
    volumes:
      - dengta_milvus_volume:/var/lib/milvus
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 10s
      start_period: 120s
      timeout: 15s
      retries: 20
    ports:
      - '${MILVUS_GRPC_PORT}:19530'
      - '${MILVUS_HTTP_PORT}:9091'
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8g
        reservations:
          cpus: '2'
          memory: 4g

networks:
  default:
    external: true
    name: dengta_backend_network
