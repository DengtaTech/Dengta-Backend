version: '3.8'

services:

  dengta_backend:
      build: 
        context: .
        dockerfile: Dockerfile
      container_name: dengta_backend_container
      env_file:
        - .env
      networks:
        - dengta_network
      
  redis:
    image: redis
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dengta_network

